<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console JS - Krelgimzy</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .hidden {
            display: none !important;
        }
        .back-project {
            margin-bottom: 20px;
        }
        .back-project a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            transition: all 0.25s var(--ease);
            display: inline-block;
            outline: none;
        }
        .back-project a:hover,
        .back-project a:focus-visible {
            color: var(--text);
            background: rgba(139, 92, 246, 0.1);
            transform: translateX(-4px);
            text-shadow: 0 0 8px rgba(139, 92, 246, 0.6);
        }
        .back-project a:focus-visible {
            box-shadow: var(--neon-glow-sm);
        }
    </style>
</head>
<body>
<div class="container">
    <div id="projectList">
        <div class="back-link"><a href="index.html">[back to index]</a></div>
        <div class="header-title">Console JS</div>
        <div class="sub-desc">可直接在浏览器控制台运行的 JavaScript 脚本</div>
        <div class="divider"></div>
        <div id="scripts-container"></div>
    </div>
</div>

<script>
const scripts = [
    {
        id: 'view-counter',
        name: '增加作品浏览量',
        author: '不想上学',
        version: '1.0',
        description: '自动增加作品浏览量，在作品页面控制台运行',
        file: 'JavaScript/files/增加作品浏览量.js'
    },
    {
        id: 'view-counter-pro',
        name: '增加作品浏览量增强版',
        author: 'ahd',
        version: '1.0',
        description: '增强版作品浏览量刷取工具，支持并发请求',
        file: 'JavaScript/files/增加作品浏览量增强版.js'
    },
    {
        id: 'view-counter-promax',
        name: '增加作品浏览量ProMax',
        author: '110200',
        version: '1.0',
        description: '由110200做的增加浏览量工具',
        file: 'JavaScript/files/增加作品浏览量ProMax.js'
    },
    {
        id: 'timer-blocker',
        name: '屏蔽计时器',
        author: '不想上学',
        version: '1.0',
        description: '屏蔽 Scratch 计时器相关积木',
        file: 'JavaScript/files/屏蔽计时器.js'
    },
    {
        id: 'coin-stealer',
        name: '经济合约盗币器',
        author: '不想上学',
        version: '1.0',
        description: '经济合约相关工具',
        file: 'JavaScript/files/经济合约盗币器.js'
    },
    {
        id: 'credential-grabber',
        name: '账密获取',
        author: '',
        version: '1.0',
        description: '获取表单账号密码',
        file: 'JavaScript/files/账密获取.js'
    },
    {
        id: 'oss-get-creds',
        name: 'OSS获取',
        author: 'chen-jie',
        version: '1.0',
        description: '获取CCW的OSS临时密钥，用于上传文件到m.ccw.site',
        file: 'JavaScript/files/oss-get-creds.js'
    }
];

function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function createScriptCard(script) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${script.id}`;
    card.innerHTML = `
        <div class="card-header">
            <div>
                <div class="card-name">${esc(script.name)}</div>
                <div class="card-meta">
                    <span>author: ${esc(script.author) || 'unknown'}</span>
                    <span>version: ${esc(script.version)}</span>
                </div>
            </div>
        </div>
        <div class="card-desc">${esc(script.description)}</div>
        <div class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" data-tab="link-${script.id}">copy link</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="copy-${script.id}">copy source</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="view-${script.id}">view source</button>
        </div>
        <div class="tab-content active" id="link-${script.id}" role="tabpanel">
            <button class="copy-btn" data-link="${esc(script.file)}">copy install link</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="copy-${script.id}" role="tabpanel">
            <button class="copy-btn" data-source-id="${script.id}">copy source code</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="view-${script.id}" role="tabpanel">
            <div class="code-block" id="code-${script.id}" tabindex="0">loading...</div>
        </div>
    `;
    return card;
}

async function loadScriptSource(file) {
    try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.text();
    } catch (e) {
        return '// Source code preview unavailable.';
    }
}

async function init() {
    const container = document.getElementById('scripts-container');

    document.addEventListener('click', (e) => {
        const tabBtn = e.target.closest('.tab-btn');
        if (tabBtn) {
            const tabId = tabBtn.dataset.tab;
            const card = tabBtn.closest('.card');
            if (!card) return;
            card.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            card.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            tabBtn.classList.add('active');
            tabBtn.setAttribute('aria-selected', 'true');
            const panel = document.getElementById(tabId);
            if (panel) panel.classList.add('active');
            return;
        }

        const copyBtn = e.target.closest('.copy-btn');
        if (!copyBtn) return;
        const sourceId = copyBtn.dataset.sourceId;
        const link = copyBtn.dataset.link;
        const status = copyBtn.nextElementSibling;

        if (link) {
            const fullUrl = `https://110200-tools.netlify.app/${link}`;
            navigator.clipboard.writeText(fullUrl).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'install link copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy install link';
                    }, 2000);
                }
            });
            return;
        }

        if (sourceId) {
            const codeBlock = document.getElementById(`code-${sourceId}`);
            const source = codeBlock ? codeBlock.textContent : '';
            navigator.clipboard.writeText(source).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'source code copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy source code';
                    }, 2000);
                }
            });
        }
    });

    for (const script of scripts) {
        container.appendChild(createScriptCard(script));
        const source = await loadScriptSource(script.file);
        const codeBlock = document.getElementById(`code-${script.id}`);
        if (codeBlock) codeBlock.textContent = source;
    }
}

init();
</script>
</body>
</html>
