<html lang="en">

        .project-icon {
            width: 40px;

            flex-shrink: 0;
            border: 1px solid var(--border-soft);
            background: var(--code-bg);
        }
        .project-icon-svg {
            width: 40px;
            height: 40px;
            margin-right: 12px;

            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-xs);

            background: var(--code-bg);
            overflow: hidden;
            transition: box-shadow 0.3s var(--ease);
        }
        .project-icon-svg svg {
            width: 32px;
            height: 32px;
            display: block;
        }
        .card-header .project-icon,
        .card-header .project-icon-svg {
            transition: box-shadow 0.3s var(--ease);
        }
        .card:hover .project-icon,
        .card:hover .project-icon-svg {
            box-shadow: var(--neon-glow-sm);
        }
        .card.clickable {
            cursor: pointer;
        }
        .card.clickable:active {
            transform: translateY(-1px) scale(0.995);
        }
        .version-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-l);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.25s var(--ease);
            z-index: 12;
        }
        .card:hover .version-badge {
            box-shadow: var(--neon-glow-sm);
            color: #ffffff;
        }
        #versions-container .card {
            padding: 20px;
        }
        #versions-container .card-header {
            margin-bottom: 8px;
            padding-right: 72px;
        }
        #project-header .card {
            cursor: default;
        }
        #project-header .card.clickable {
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .project-name-row {
            display: flex;
            align-items: center;
        }
        .back-project {
            margin-bottom: 20px;
        }
        .back-project a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            transition: all 0.25s var(--ease);
            display: inline-block;
            outline: none;
        }
        .back-project a:hover,
        .back-project a:focus-visible {
            color: var(--text);
            background: rgba(139, 92, 246, 0.1);
            transform: translateX(-4px);
            text-shadow: 0 0 8px rgba(139, 92, 246, 0.6);
        }
        .back-project a:focus-visible {
            box-shadow: var(--neon-glow-sm);
        }
        .tab-content .copy-status {
            display: inline-block;
        }
        .empty-tip {
            color: var(--text-muted);
            padding: 16px 0;
            text-align: center;
            font-size: 13px;
        }
        .toolbar {
            margin-bottom: 16px;

            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .nav-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 14px;
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border-soft);

            margin: 24px 0 12px;

            background: var(--bg);
            position: relative;
            z-index: 1;
        }

            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border-soft);

            align-items: center;
            justify-content: center;

            letter-spacing: 0.3px;

            border: none;
            color: var(--text-dim);
            font-size: 20px;

            border-radius: var(--radius-xs);

            line-height: 1;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;

            margin-left: auto;

            border-bottom: 1px solid var(--border-soft);

let currentProject = null;

function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function makeVersionId(project, ver, index) {
    return `${project.id}-v${index}-${String(ver.version).replace(/[^a-zA-Z0-9]/g, '_')}`;
}

function buildIconHtml(item) {
    if (!item.icon) return '';
    if (item.isSvg) {
        return `<div class="project-icon-svg" aria-hidden="true">${item.icon}</div>`;
    }
    return `<img src="${esc(item.icon)}" class="project-icon" alt="">`;
}

function showProjectList() {
    document.getElementById('projectList').classList.remove('hidden');
    document.getElementById('projectDetail').classList.add('hidden');
    currentProject = null;
}

function buildTabs(versionId) {
    return `
        <div class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" data-tab="link-${versionId}">copy link</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="install-${versionId}">install</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="copy-${versionId}">copy source</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="view-${versionId}">view source</button>
        </div>
    `;
}

function buildTabPanels(versionId, file) {
    return `
        <div class="tab-content active" id="link-${versionId}" role="tabpanel">
            <button class="copy-btn" data-link="${esc(file)}">copy install link</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="install-${versionId}" role="tabpanel">
            <button class="copy-btn" data-link="${esc(file)}">install script</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="copy-${versionId}" role="tabpanel">
            <button class="copy-btn" data-source-id="${versionId}">copy source code</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="view-${versionId}" role="tabpanel">
            <div class="code-block" id="code-${versionId}" tabindex="0">loading...</div>
        </div>
    `;
}

function showProjectDetail(projectId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;
    currentProject = project;

    document.getElementById('projectList').classList.add('hidden');
    document.getElementById('projectDetail').classList.remove('hidden');

    const isCsrt = project.id === 'csrt';
    const headerCardClass = isCsrt ? 'card clickable' : 'card';
    const headerCardTabIndex = isCsrt ? '0' : '';
    const headerCardRole = isCsrt ? 'button' : '';
    const headerCardAriaLabel = isCsrt ? `open CSRT website` : '';

    const headerHtml = `
        <div class="${headerCardClass}" id="project-header-card" tabindex="${headerCardTabIndex}" role="${headerCardRole}" aria-label="${headerCardAriaLabel}">
            <div class="card-header">
                <div class="project-name-row">
                    ${buildIconHtml(project)}
                    <div>
                        <div class="card-name">${esc(project.name)}</div>
                        <div class="card-meta">
                            <span>author: ${esc(project.author) || 'unknown'}</span>
                            <span>versions: ${project.versions.length}</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-desc">${esc(project.description)}</div>
        </div>
    `;
    document.getElementById('project-header').innerHTML = headerHtml;

    if (isCsrt) {
        const headerCard = document.getElementById('project-header-card');
        if (headerCard) {
            headerCard.addEventListener('click', () => {
                window.open('https://csrt.netlify.app/', '_blank');
            });
            headerCard.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    window.open('https://csrt.netlify.app/', '_blank');
                }
            });
        }
    }

    const versionsContainer = document.getElementById('versions-container');
    versionsContainer.innerHTML = '';

    project.versions.forEach((ver, index) => {
        const versionId = makeVersionId(project, ver, index);
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${versionId}`;
        card.innerHTML = `
            <span class="version-badge">v${esc(ver.version)}</span>
            <div class="card-header">
                <div>
                    <div class="card-name">${esc(ver.name)}</div>
                    <div class="card-meta">
                        <span>author: ${esc(ver.author || project.author) || 'unknown'}</span>
                        <span>version: ${esc(ver.version)}</span>
                    </div>
                </div>
            </div>
            <div class="card-desc">${esc(ver.description)}</div>
            ${buildTabs(versionId)}
            ${buildTabPanels(versionId, ver.file)}
        `;
        versionsContainer.appendChild(card);
    });

    project.versions.forEach(async (ver, index) => {
        const versionId = makeVersionId(project, ver, index);
        const codeBlock = document.getElementById(`code-${versionId}`);
        if (!codeBlock) return;
        const source = await loadVersionSource(ver);
        codeBlock.textContent = source;
    });

    if (project.branches && project.branches.length > 0) {
        const branchesDivider = document.createElement('div');
        branchesDivider.className = 'branch-divider';
        branchesDivider.innerHTML = '<span>分支模块</span>';
        versionsContainer.appendChild(branchesDivider);

        project.branches.forEach((branch, index) => {
            const branchId = `${project.id}-branch-${index}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${branchId}`;
            card.innerHTML = `
                <span class="version-badge">branch</span>
                <div class="card-header">
                    <div>
                        <div class="card-name">${esc(branch.name)}</div>
                        <div class="card-meta">
                            <span>author: ${esc(project.author) || 'unknown'}</span>
                        </div>
                    </div>
                </div>
                <div class="card-desc">${esc(branch.description)}</div>
                ${buildTabs(branchId)}
                ${buildTabPanels(branchId, branch.file)}
            `;
            versionsContainer.appendChild(card);
        });

        project.branches.forEach(async (branch, index) => {
            const branchId = `${project.id}-branch-${index}`;
            const codeBlock = document.getElementById(`code-${branchId}`);
            if (!codeBlock) return;
            const source = await loadVersionSource(branch);
            codeBlock.textContent = source;
        });
    }
}

async function loadVersionSource(ver) {
    try {
        const response = await fetch(ver.file);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.text();
    } catch (e) {
        return '// Source code preview unavailable. Please use "copy link" to install the script.';
    }
}

function createProjectCard(project) {
    const card = document.createElement('div');
    card.className = 'card clickable';
    card.id = `card-${project.id}`;
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `open project ${project.name}`);
    card.innerHTML = `
        <div class="card-header">
            <div class="project-name-row">
                ${buildIconHtml(project)}
                <div>
                    <div class="card-name">${esc(project.name)}</div>
                    <div class="card-meta">
                        <span>author: ${esc(project.author) || 'unknown'}</span>
                        <span>versions: ${project.versions.length}</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-desc">${esc(project.description)}</div>
    `;
    card.addEventListener('click', () => showProjectDetail(project.id));
    card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            showProjectDetail(project.id);
        }
    });
    return card;
}

function createScriptCard(script) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${script.id}`;
    const versionId = script.id;
    card.innerHTML = `
        <div class="card-header">
            <div class="project-name-row">
                ${script.icon ? `<img src="${esc(script.icon)}" class="project-icon" alt="">` : ''}
                <div>
                    <div class="card-name">${esc(script.name)}</div>
                    <div class="card-meta">
                        <span>author: ${esc(script.author) || 'unknown'}</span>
                        <span>version: ${esc(script.version)}</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-desc">${esc(script.description)}</div>
        <div class="tabs" role="tablist">
            <button class="tab-btn active" role="tab" aria-selected="true" data-tab="link-${versionId}">copy link</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="copy-${versionId}">copy source</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-tab="view-${versionId}">view source</button>
        </div>
        <div class="tab-content active" id="link-${versionId}" role="tabpanel">
            <button class="copy-btn" data-link="${esc(script.file)}">copy install link</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="copy-${versionId}" role="tabpanel">
            <button class="copy-btn" data-source-id="${versionId}">copy source code</button>
            <span class="copy-status" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="view-${versionId}" role="tabpanel">
            <div class="code-block" id="code-${versionId}" tabindex="0">loading...</div>
        </div>
    `;
    return card;
}

function getAllScripts() {
    const allScripts = [];
    for (const project of projects) {
        for (const ver of project.versions) {
            allScripts.push({
                id: `${project.id}-${ver.version}-${ver.name}`,
                name: ver.name || project.name,
                author: ver.author || project.author,
                version: ver.version,
                file: ver.file,
                project: project.name
            });
        }
    }
    for (const script of scripts) {
        allScripts.push({
            id: script.id,
            name: script.name,
            author: script.author,
            version: script.version,
            file: script.file,
            project: '独立脚本'
        });
    }
    return allScripts;
}

let batchInstallInitialized = false;
function initBatchInstall() {
    if (batchInstallInitialized) return;
    batchInstallInitialized = true;

    const modal = document.getElementById('batchModal');
    const batchList = document.getElementById('batchList');
    const batchCount = document.getElementById('batchCount');
    const selectedScripts = new Set();
    const allScripts = getAllScripts();

    function openModal() {
        modal.classList.remove('hidden');
        renderBatchList();
    }
    function closeModal() {
        modal.classList.add('hidden');
    }
    document.getElementById('batchInstallBtn').addEventListener('click', openModal);
    document.getElementById('batchCloseBtn').addEventListener('click', closeModal);
    document.getElementById('batchCancelBtn').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
    });

    function renderBatchList() {
        batchList.innerHTML = '';
        allScripts.forEach((s, i) => {
            const item = document.createElement('div');
            item.className = 'batch-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = `batch-cb-${i}`;
            cb.checked = selectedScripts.has(s.id);
            cb.addEventListener('change', () => {
                if (cb.checked) selectedScripts.add(s.id);
                else selectedScripts.delete(s.id);
                updateCount();
            });
            const label = document.createElement('label');
            label.htmlFor = `batch-cb-${i}`;
            label.innerHTML = `<span class="batch-project">[${esc(s.project)}]</span> ${esc(s.name)} <span class="batch-meta">v${esc(s.version)} &middot; ${esc(s.author) || 'unknown'}</span>`;
            item.appendChild(cb);
            item.appendChild(label);
            batchList.appendChild(item);
        });
        updateCount();
    }

    function updateCount() {
        batchCount.textContent = `已选 ${selectedScripts.size} 个`;
    }

    document.getElementById('batchSelectAll').addEventListener('click', () => {
        allScripts.forEach(s => selectedScripts.add(s.id));
        renderBatchList();
    });
    document.getElementById('batchDeselectAll').addEventListener('click', () => {
        selectedScripts.clear();
        renderBatchList();
    });

    document.getElementById('batchConfirmBtn').addEventListener('click', () => {
        if (selectedScripts.size === 0) return;
        const selected = allScripts.filter(s => selectedScripts.has(s.id));
        const baseUrl = 'https://110200-tools.netlify.app/';
        selected.forEach((s, i) => {
            setTimeout(() => {
                window.open(baseUrl + s.file, '_blank');
            }, i * 500);
        });
        closeModal();
    });
}

async function init() {
    const container = document.getElementById('scripts-container');

    document.addEventListener('click', (e) => {
        const tabBtn = e.target.closest('.tab-btn');
        if (tabBtn) {
            const tabId = tabBtn.dataset.tab;
            const card = tabBtn.closest('.card');
            if (!card) return;
            card.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            card.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            tabBtn.classList.add('active');
            tabBtn.setAttribute('aria-selected', 'true');
            const panel = document.getElementById(tabId);
            if (panel) panel.classList.add('active');
            return;
        }

        const copyBtn = e.target.closest('.copy-btn');
        if (!copyBtn) return;

        const sourceId = copyBtn.dataset.sourceId;
        const link = copyBtn.dataset.link;
        const parentTab = copyBtn.closest('.tab-content');
        const isInstallTab = parentTab && parentTab.id.startsWith('install-');
        const status = copyBtn.nextElementSibling;

        if (isInstallTab && link) {
            const fullUrl = `https://110200-tools.netlify.app/${link}`;
            window.open(fullUrl, '_blank');
            if (status) {
                status.textContent = 'opening install page...';
                setTimeout(() => { status.textContent = ''; }, 2000);
            }
            return;
        }

        if (link) {
            const fullUrl = `https://110200-tools.netlify.app/${link}`;
            navigator.clipboard.writeText(fullUrl).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'install link copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy install link';
                    }, 2000);
                }
            });
            return;
        }

        if (sourceId) {
            const codeBlock = document.getElementById(`code-${sourceId}`);
            const source = codeBlock ? codeBlock.textContent : '';
            navigator.clipboard.writeText(source).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'source code copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy source code';
                    }, 2000);
                }
            });
        }
    });

    for (const project of projects) {
        container.appendChild(createProjectCard(project));
    }

    for (const script of scripts) {
        container.appendChild(createScriptCard(script));
        const source = await loadVersionSource(script);
        const codeBlock = document.getElementById(`code-${script.id}`);
        if (codeBlock) codeBlock.textContent = source;
    }

    initBatchInstall();
}

init();
