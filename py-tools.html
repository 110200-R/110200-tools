<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tools - Krelgimzy</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .project-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-xs);
            margin-right: 12px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-soft);
            background: var(--code-bg);
        }
        .card-header .project-icon {
            transition: box-shadow 0.3s var(--ease);
        }
        .card:hover .project-icon {
            box-shadow: var(--neon-glow-sm);
        }
        .card.clickable {
            cursor: pointer;
        }
        .card.clickable:active {
            transform: translateY(-1px) scale(0.995);
        }
        .version-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(139, 92, 246, 0.15);
            color: var(--accent-l);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.25s var(--ease);
            z-index: 12;
        }
        .card:hover .version-badge {
            box-shadow: var(--neon-glow-sm);
            color: #ffffff;
        }
        #versions-container .card {
            padding: 20px;
        }
        #versions-container .card-header {
            margin-bottom: 8px;
            padding-right: 72px;
        }
        #project-header .card {
            cursor: default;
        }
        .hidden {
            display: none !important;
        }
        .project-name-row {
            display: flex;
            align-items: center;
        }
        .back-project {
            margin-bottom: 20px;
        }
        .back-project a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            transition: all 0.25s var(--ease);
            display: inline-block;
            outline: none;
        }
        .back-project a:hover,
        .back-project a:focus-visible {
            color: var(--text);
            background: rgba(139, 92, 246, 0.1);
            transform: translateX(-4px);
            text-shadow: 0 0 8px rgba(139, 92, 246, 0.6);
        }
        .back-project a:focus-visible {
            box-shadow: var(--neon-glow-sm);
        }
        .tab-content .copy-status {
            display: inline-block;
        }
        .empty-tip {
            color: var(--text-muted);
            padding: 16px 0;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="projectList">
        <div class="back-link"><a href="index.html">[back to index]</a></div>
        <div class="header-title">Python Tools</div>
        <div class="sub-desc">python utilities and automation scripts</div>
        <div class="divider"></div>
        <div id="projects-container"></div>
    </div>
    <div id="projectDetail" class="hidden">
        <div class="back-project">
            <a href="#" onclick="showProjectList(); return false;">&larr; back to projects</a>
        </div>
        <div id="project-header"></div>
        <div class="divider"></div>
        <div id="versions-container"></div>
    </div>
</div>

<script>
const projects = [
    {
        id: 'ccw-oid-finder',
        name: 'CCW OID Finder',
        author: 'ahd',
        icon: 'https://m.ccw.site/community/images/logo-ccw.png',
        description: '获取CCW大部分用户OID工具，支持批量获取，凡事在作品别人主页热门评论星球等地方有评论过会有动态的用户就能爬出来',
        versions: [
            {
                version: '1.0',
                description: '获取CCW大部分用户OID工具，支持批量获取，凡事在作品别人主页热门评论星球等地方有评论过会有动态的用户就能爬出来',
                file: 'get.ccwUsers UUID(all).py'
            }
        ]
    },
    {
        id: 'bombers',
        name: 'Bombers',
        author: 'everydaycodings, D3XBugg3R',
        icon: 'https://m.ccw.site/community/images/logo-ccw.png',
        description: '邮件和短信轰炸工具集合',
        versions: [
            {
                version: '2.0',
                name: 'Email Bomber v2',
                author: 'everydaycodings',
                description: '邮件轰炸工具，支持批量发送',
                file: 'Python/Bombers-master/Email_Bomber_Version2.py'
            },
            {
                version: '1.0',
                name: 'Email Bomber',
                author: 'everydaycodings',
                description: '基础邮件轰炸工具',
                file: 'Python/Bombers-master/Email_bomber.py'
            },
            {
                version: '1.0',
                name: 'SMS Bomber',
                author: 'D3XBugg3R',
                description: '短信轰炸工具',
                file: 'Python/Bombers-master/SMS_bomber.py'
            },
            {
                version: '2.0',
                name: 'SMS Bomber v2',
                author: 'D3XBugg3R',
                description: '短信轰炸工具升级版',
                file: 'Python/Bombers-master/SMS_bomber_version2.py'
            },
            {
                version: '1.0',
                name: 'Twitter Bomber',
                author: 'D3XBugg3R',
                description: 'Twitter 轰炸工具',
                file: 'Python/Bombers-master/Twitter_bomber.py'
            },
            {
                version: '1.0',
                name: 'NumSpy Bomber',
                author: 'D3XBugg3R',
                description: '号码轰炸工具',
                file: 'Python/Bombers-master/numspy_bomber.py'
            },
            {
                version: '1.0',
                name: 'SMS Bomber Updated',
                author: 'D3XBugg3R',
                description: '短信轰炸工具更新版',
                file: 'Python/Bombers-master/sms_bomber_updated.py'
            },
            {
                version: '1.0',
                name: 'Spam',
                author: 'D3XBugg3R',
                description: '垃圾信息发送工具',
                file: 'Python/Bombers-master/spam.py'
            },
            {
                version: '1.0',
                name: 'WBomb',
                author: 'D3XBugg3R',
                description: 'WhatsApp 轰炸工具',
                file: 'Python/Bombers-master/wbomb.py'
            }
        ]
    },
    {
        id: 'email-bomber',
        name: 'Python Email Bomber',
        author: '',
        icon: 'https://m.ccw.site/community/images/logo-ccw.png',
        description: 'Python 邮件轰炸工具',
        versions: [
            {
                version: '1.0',
                name: 'Email Bomber v1.0',
                author: '',
                description: 'Python 邮件轰炸工具 v1.0',
                file: 'Python/Python---Email-Bomber-master/Email_Bomber.py'
            }
        ]
    },
    {
        id: 'ni-bomber',
        name: 'NI Bomber',
        author: 'nikait',
        icon: 'https://m.ccw.site/community/images/logo-ccw.png',
        description: '俄罗斯号码短信轰炸工具',
        versions: [
            {
                version: '2.4',
                name: 'NI Bomber 2.4',
                author: 'nikait',
                description: '俄罗斯号码短信轰炸工具 v2.4',
                file: 'Python/ni_bomber-master/ni_bomber.py'
            }
        ]
    }
];

let currentProject = null;

function makeVersionId(project, ver, index) {
    return `${project.id}-v${index}-${String(ver.version).replace(/[^a-zA-Z0-9]/g, '_')}`;
}

function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function showProjectList() {
    document.getElementById('projectList').classList.remove('hidden');
    document.getElementById('projectDetail').classList.add('hidden');
    currentProject = null;
}

function showProjectDetail(projectId) {
    const project = projects.find(p => p.id === projectId);
    if (!project) return;
    currentProject = project;

    document.getElementById('projectList').classList.add('hidden');
    document.getElementById('projectDetail').classList.remove('hidden');

    const headerHtml = `
        <div class="card">
            <div class="card-header">
                <div class="project-name-row">
                    <img src="${esc(project.icon)}" class="project-icon" alt="${esc(project.name)} icon">
                    <div>
                        <div class="card-name">${esc(project.name)}</div>
                        <div class="card-meta">
                            <span>author: ${esc(project.author) || 'unknown'}</span>
                            <span>versions: ${project.versions.length}</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-desc">${esc(project.description)}</div>
        </div>
    `;
    document.getElementById('project-header').innerHTML = headerHtml;

    const versionsContainer = document.getElementById('versions-container');
    versionsContainer.innerHTML = '';

    project.versions.forEach((ver, index) => {
        const versionId = makeVersionId(project, ver, index);
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${versionId}`;
        const displayName = ver.name || project.name;
        card.innerHTML = `
            <span class="version-badge">v${esc(ver.version)}</span>
            <div class="card-header">
                <div>
                    <div class="card-name">${esc(displayName)}</div>
                    <div class="card-meta">
                        <span>author: ${esc(ver.author || project.author) || 'unknown'}</span>
                        <span>version: ${esc(ver.version)}</span>
                    </div>
                </div>
            </div>
            <div class="card-desc">${esc(ver.description || '')}</div>
            <div class="tabs" role="tablist">
                <button class="tab-btn active" role="tab" aria-selected="true"
                        data-tab="link-${versionId}">copy link</button>
                <button class="tab-btn" role="tab" aria-selected="false"
                        data-tab="copy-${versionId}">copy source</button>
                <button class="tab-btn" role="tab" aria-selected="false"
                        data-tab="view-${versionId}">view source</button>
            </div>
            <div class="tab-content active" id="link-${versionId}" role="tabpanel">
                <button class="copy-btn" data-link="${esc(ver.file)}">copy download link</button>
                <span class="copy-status" aria-live="polite"></span>
            </div>
            <div class="tab-content" id="copy-${versionId}" role="tabpanel">
                <button class="copy-btn" data-source-id="${versionId}">copy source code</button>
                <span class="copy-status" aria-live="polite"></span>
            </div>
            <div class="tab-content" id="view-${versionId}" role="tabpanel">
                <div class="code-block" id="code-${versionId}" tabindex="0">loading...</div>
            </div>
        `;
        versionsContainer.appendChild(card);
    });

    project.versions.forEach(async (ver, index) => {
        const versionId = makeVersionId(project, ver, index);
        const codeBlock = document.getElementById(`code-${versionId}`);
        if (!codeBlock) return;
        const source = await loadVersionSource(ver);
        codeBlock.textContent = source;
    });
}

async function loadVersionSource(ver) {
    try {
        const url = encodeURI(ver.file);
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return await response.text();
    } catch (e) {
        return '# Failed to load source code: ' + e.message;
    }
}

function createProjectCard(project) {
    const card = document.createElement('div');
    card.className = 'card clickable';
    card.id = `card-${project.id}`;
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `open project ${project.name}`);
    card.innerHTML = `
        <div class="card-header">
            <div class="project-name-row">
                <img src="${esc(project.icon)}" class="project-icon" alt="${esc(project.name)} icon">
                <div>
                    <div class="card-name">${esc(project.name)}</div>
                    <div class="card-meta">
                        <span>author: ${esc(project.author) || 'unknown'}</span>
                        <span>versions: ${project.versions.length}</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-desc">${esc(project.description)}</div>
    `;
    card.addEventListener('click', () => showProjectDetail(project.id));
    card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            showProjectDetail(project.id);
        }
    });
    return card;
}

function init() {
    const container = document.getElementById('projects-container');

    document.addEventListener('click', (e) => {
        const tabBtn = e.target.closest('.tab-btn');
        if (tabBtn) {
            const tabId = tabBtn.dataset.tab;
            const card = tabBtn.closest('.card');
            if (!card) return;
            card.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            card.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            tabBtn.classList.add('active');
            tabBtn.setAttribute('aria-selected', 'true');
            const panel = document.getElementById(tabId);
            if (panel) panel.classList.add('active');
            return;
        }

        const copyBtn = e.target.closest('.copy-btn');
        if (!copyBtn) return;
        const sourceId = copyBtn.dataset.sourceId;
        const link = copyBtn.dataset.link;

        if (link) {
            const fullUrl = `https://lqs2011.dpdns.org/${link}`;
            navigator.clipboard.writeText(fullUrl).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                const status = copyBtn.nextElementSibling;
                if (status) {
                    status.textContent = 'download link copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy download link';
                    }, 2000);
                }
            });
        } else if (sourceId) {
            const codeBlock = document.getElementById(`code-${sourceId}`);
            const source = codeBlock ? codeBlock.textContent : '';
            navigator.clipboard.writeText(source).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                const status = copyBtn.nextElementSibling;
                if (status) {
                    status.textContent = 'source code copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy source code';
                    }, 2000);
                }
            });
        }
    });

    for (const project of projects) {
        container.appendChild(createProjectCard(project));
    }
}

init();
</script>
</body>
</html>
