function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function makeVersionId(project, ver) {
    return `${project.id}-v${String(ver.version).replace(/[^a-zA-Z0-9]/g, '_')}`;
}

function buildIconHtml(item) {
    if (!item.icon) return '';
    if (item.isSvg) {
        return `<div class="project-icon-svg" aria-hidden="true">${item.icon}</div>`;
    }
    return `<img src="${esc(item.icon)}" class="project-icon" alt="">`;
}

async function loadExtensionSource(ext) {
    try {
        let jsUrl = ext.file;

        if (ext.isRemote && String(ext.file).includes('.txt')) {
            const urlResponse = await fetch(ext.file);
            if (urlResponse.ok) {
                jsUrl = (await urlResponse.text()).trim();
            }
        }

        const isOSSLink = ext.isRemote && String(ext.file).includes('m.ccw.site');

        if (!ext.isRemote) {
            jsUrl = encodeURIComponent(ext.file).replace(/%2F/g, '/');
        }

        try {
            const response = await fetch(jsUrl);
            if (response.ok) {
                return await response.text();
            }
        } catch (fetchError) {
            if (isOSSLink) {
                return `// OSS Hosted Extension: ${ext.file}\n// This file is hosted on m.ccw.site\n// Due to CORS restrictions, source code cannot be displayed here\n// Click "copy link" to get the direct URL and view it in a new tab\n// Direct URL: ${ext.file}`;
            }
            throw fetchError;
        }

        if (!ext.isRemote) {
            return `// Local file: ${ext.file}\n// File size: 180KB\n// Note: Source code viewing requires HTTP server access\n// Please access this page via HTTP server (e.g. http://localhost:8000/)\n// Or click "copy link" to get the file path and open it directly`;
        }

        return `// Source URL: ${jsUrl}\n// Unable to load source code due to CORS restrictions`;
    } catch (e) {
        if (!ext.isRemote) {
            return `// Local file: ${ext.file}\n// Note: Source code viewing requires HTTP server access\n// Error: ${e.message}\n// Please access this page via HTTP server (e.g. http://localhost:8000/)\n// Or click "copy link" to get the file path and open it directly`;
        }
        return `// Source URL: ${ext.file}\n// Unable to load source code (remote or CORS restricted)\n// Error: ${e.message}`;
    }
}

function createProjectCard(project) {

    card.className = 'card clickable';
    card.id = `card-${project.id}`;
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `open project ${project.name}`);
    card.innerHTML = `
        <div class="card-header">
            <div class="project-name-row">
                ${buildIconHtml(project)}
                <div>
                    <div class="card-name">${esc(project.name)}</div>
                    <div class="card-meta">
                        <span>author: ${esc(project.author) || 'unknown'}</span>
                        <span>versions: ${project.versions.length}</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-desc">${esc(project.description)}</div>
    `;
    card.addEventListener('click', () => showProjectDetail(project.id));
    card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            showProjectDetail(project.id);
        }
    });
    return card;
}

async function init() {
    const container = document.getElementById('extensions-container');

    document.addEventListener('click', (e) => {
        const openTabBtn = e.target.closest('.open-tab-btn');
        if (openTabBtn) {
            const url = openTabBtn.dataset.url;
            if (url) window.open(url, '_blank');
            return;
        }

        const tabBtn = e.target.closest('.tab-btn');
        if (tabBtn) {
            const tabId = tabBtn.dataset.tab;
            const card = tabBtn.closest('.card');
            if (!card) return;
            card.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            card.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            tabBtn.classList.add('active');
            tabBtn.setAttribute('aria-selected', 'true');
            const tabContent = card.querySelector(`#${tabId}`);
            if (tabContent) tabContent.classList.add('active');
            return;
        }

        const copyBtn = e.target.closest('.copy-btn');
        if (!copyBtn) return;
        const status = copyBtn.nextElementSibling;

        if (copyBtn.dataset.extUrl) {
            const extUrl = copyBtn.dataset.extUrl;
            const isRemote = copyBtn.dataset.remote === 'true';
            const fullUrl = isRemote || extUrl.startsWith('http') ? extUrl : `https://110200-tools.netlify.app/${extUrl}`;
            const gandiUrl = `https://www.ccw.site/gandi/?ext=${encodeURIComponent(fullUrl)}`;
            window.open(gandiUrl, '_blank');
            if (status) {
                status.textContent = 'opening CCW to create project...';
                setTimeout(() => { status.textContent = ''; }, 2000);
            }
            return;
        }

        if (copyBtn.dataset.ossUrl) {
            navigator.clipboard.writeText(copyBtn.dataset.ossUrl).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'OSS link copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy OSS link';
                    }, 2000);
                }
            });
            return;
        }

        if (copyBtn.dataset.link) {
            const link = copyBtn.dataset.link;
            const isRemote = copyBtn.dataset.remote === 'true';
            const fullUrl = isRemote || link.startsWith('http') ? link : `https://110200-tools.netlify.app/${link}`;
            navigator.clipboard.writeText(fullUrl).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'extension link copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy extension link';
                    }, 2000);
                }
            });
            return;
        }

        if (copyBtn.dataset.sourceId) {
            const sourceId = copyBtn.dataset.sourceId;
            const codeBlock = document.getElementById(`code-${sourceId}`);
            const source = codeBlock ? codeBlock.textContent : (sourceCache[sourceId] || '');
            navigator.clipboard.writeText(source).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = 'copied!';
                if (status) {
                    status.textContent = 'source code copied to clipboard';
                    setTimeout(() => {
                        status.textContent = '';
                        copyBtn.classList.remove('copied');
                        copyBtn.textContent = 'copy source code';
                    }, 2000);
                }
            });
        }
    });

    for (const project of projects) {
        container.appendChild(createProjectCard(project));
    }

    for (const ext of extensions) {
        container.appendChild(createExtCard(ext));
        const source = await loadExtensionSource(ext);
        const codeBlock = document.getElementById(`code-${ext.id}`);
        if (codeBlock) codeBlock.textContent = source;
        sourceCache[ext.id] = source;
    }
}

init();
</script>
</body>
</html>
